<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
</helmet>
<aside style="width:240px; min-width:240px; position:sticky; top:0; height:100vh; overflow-y:auto; background:#0f1011; border-right:1px solid #23252a; padding:20px 12px; display:flex; flex-direction:column; gap:2px; font-family:Inter, system-ui, sans-serif;">
  <div style="display:flex; align-items:center; gap:9px; padding:4px 8px 18px;">
    <div style="width:16px; height:16px; border:1.5px solid #2bd4d9; border-radius:3px; transform:rotate(45deg);"></div>
    <span style="font-size:14px; font-weight:500; color:#ffffff; letter-spacing:-0.01em;">SnowPro Core Prep</span>
  </div>
  <sc-for list="{{ items }}" as="item" hint-placeholder-count="9">
    <a href="{{ item.href }}" style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:6px; font-size:14px; text-decoration:none; color:{{ item.fg }}; background:{{ item.bg }}; border-left:2px solid {{ item.bar }};" style-hover="background:#161718; color:#ffffff;">
      <span>{{ item.label }}</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#62666d;">{{ item.meta }}</span>
    </a>
  </sc-for>
  <div style="margin-top:auto; padding-top:16px; border-top:1px solid #1a1c1e; display:flex; align-items:center; gap:8px;">
    <div style="flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid #23252a; border-radius:6px; color:#8a8f98; font-size:13px;">
      <span>Search</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#62666d;">⌘K</span>
    </div>
    <div style="width:34px; height:34px; border:1px solid #23252a; border-radius:6px; color:#8a8f98; font-size:14px; display:flex; align-items:center; justify-content:center;">⚙</div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Notes&quot;,&quot;Practice&quot;,&quot;Mock exams&quot;,&quot;Flashcards&quot;,&quot;Study plan&quot;,&quot;Analytics&quot;,&quot;Resources&quot;,&quot;Setup&quot;],&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "Dashboard";
    const defs = [
      ["Dashboard", "Dashboard.dc.html", ""],
      ["Notes", "Notes.dc.html", "5"],
      ["Practice", "Practice.dc.html", "50"],
      ["Mock exams", "Mock Exams.dc.html", "1"],
      ["Flashcards", "Flashcards.dc.html", ""],
      ["Study plan", "Study Plan.dc.html", ""],
      ["Analytics", "Analytics.dc.html", ""],
      ["Resources", "Resources.dc.html", ""],
      ["Setup", "Setup.dc.html", ""]
    ];
    return {
      items: defs.map(([label, href, meta]) => ({
        label, href, meta,
        bg: label === active ? "#161718" : "transparent",
        bar: label === active ? "#2bd4d9" : "transparent",
        fg: label === active ? "#ffffff" : "#d0d6e0"
      }))
    };
  }
}
</script>
</body>
</html>
