services:
  snowprep:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowprep-core-prep:latest
    # No host port publish (issue #64) -- only reachable via the caddy service below now, over the
    # internal Docker network (service name "snowprep", its own :8080 never exposed to the LAN
    # directly). This is what actually makes HTTPS the only way in, not just an option alongside
    # plain HTTP.
    volumes:
      - ./SnowPro_Notes_and_Questions:/content
      - ./data:/data
    environment:
      PORT: "8080"
      SNOWPRO_CONTENT_SOURCE: /content
      SNOWPRO_CONTENT_OUTPUT: /app/content
      SNOWPRO_DATA_DIR: /data
      SNOWPRO_DIST_DIR: /app/dist
      # Forgot-password email (issue #59) — pulled from a sibling .env file (see .env.example);
      # left unset, POST /api/password-reset/request fails clearly with an operator-facing error
      # instead of the app refusing to boot.
      SNOWPRO_SMTP_HOST: ${SNOWPRO_SMTP_HOST:-}
      SNOWPRO_SMTP_PORT: ${SNOWPRO_SMTP_PORT:-587}
      SNOWPRO_SMTP_USER: ${SNOWPRO_SMTP_USER:-}
      SNOWPRO_SMTP_PASS: ${SNOWPRO_SMTP_PASS:-}
      SNOWPRO_SMTP_FROM: ${SNOWPRO_SMTP_FROM:-}
      SNOWPRO_SMTP_SECURE: ${SNOWPRO_SMTP_SECURE:-false}
      # Issue #62: emailed links (password reset, admin-added-user login link) prefer this host
      # over whatever's in the request's Host header, since that can be a raw LAN IP (changes on
      # reboot) or "localhost" (meaningless to anyone but the admin's own machine). Compose reads
      # COMPUTERNAME from the host shell automatically -- Windows always has it set, no manual
      # config needed. Empty/unset on non-Windows hosts, where the request-based fallback applies.
      SNOWPRO_HOST_NAME: ${COMPUTERNAME:-}
    restart: unless-stopped

  # Issue #64: TLS termination. `tls internal` (Caddyfile) auto-generates a local CA + cert with
  # no cert files or ACME account to manage -- caddy_data persists that CA across restarts so it
  # isn't regenerated (and every browser's trust exception re-triggered) on every `up`.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - snowprep
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
