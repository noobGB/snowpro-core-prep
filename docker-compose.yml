services:
  snowprep:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowprep-core-prep:latest
    ports:
      - "8080:8080"
    volumes:
      - ./SnowPro_Notes_and_Questions:/content
      - ./data:/data
    environment:
      PORT: "8080"
      SNOWPRO_CONTENT_SOURCE: /content
      SNOWPRO_CONTENT_OUTPUT: /app/content
      SNOWPRO_DATA_DIR: /data
      SNOWPRO_DIST_DIR: /app/dist
      # Forgot-password email (issue #59) — pulled from a sibling .env file (see .env.example);
      # left unset, POST /api/password-reset/request fails clearly with an operator-facing error
      # instead of the app refusing to boot.
      SNOWPRO_SMTP_HOST: ${SNOWPRO_SMTP_HOST:-}
      SNOWPRO_SMTP_PORT: ${SNOWPRO_SMTP_PORT:-587}
      SNOWPRO_SMTP_USER: ${SNOWPRO_SMTP_USER:-}
      SNOWPRO_SMTP_PASS: ${SNOWPRO_SMTP_PASS:-}
      SNOWPRO_SMTP_FROM: ${SNOWPRO_SMTP_FROM:-}
      SNOWPRO_SMTP_SECURE: ${SNOWPRO_SMTP_SECURE:-false}
      # Issue #62/#68: emailed links (password reset, admin-added-user login link) prefer a stable
      # host name over whatever's in the request's Host header, since that can be a raw LAN IP
      # (changes on reboot) or "localhost" (meaningless to anyone but the admin's own machine).
      # Three inputs, most-specific first -- server.ts's publicOrigin() does the actual coalescing
      # in order, not Compose: `${A:-${B:-}}`-style nesting isn't reliably supported by Compose's
      # interpolation, so each candidate is passed through under its own name instead of chained
      # here. SNOWPRO_HOST_NAME is the manual override (.env, for whichever platform's automatic
      # guess below doesn't apply or isn't set). COMPUTERNAME is always set on Windows -- zero
      # config needed there. HOSTNAME is commonly (not universally -- depends on shell/profile)
      # exported on Mac/Linux; when neither fires, publicOrigin() falls back to the request's own
      # Host header, this app's original pre-#62 behavior.
      SNOWPRO_HOST_NAME: ${SNOWPRO_HOST_NAME:-}
      SNOWPRO_HOST_NAME_COMPUTERNAME: ${COMPUTERNAME:-}
      SNOWPRO_HOST_NAME_HOSTNAME: ${HOSTNAME:-}
    restart: unless-stopped
