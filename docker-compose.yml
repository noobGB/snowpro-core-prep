services:
  snowprep:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowprep-core-prep:latest
    ports:
      - "8080:8080"
    volumes:
      - ./SnowPro_Notes_and_Questions:/content
      - ./data:/data
    environment:
      PORT: "8080"
      SNOWPRO_CONTENT_SOURCE: /content
      SNOWPRO_CONTENT_OUTPUT: /app/content
      SNOWPRO_DATA_DIR: /data
      SNOWPRO_DIST_DIR: /app/dist
      # Outbound email (forgot-password #59, admin-invite #62, welcome #93) via Brevo's HTTP API,
      # not SMTP (issue #95 — Railway and similar hosts block outbound SMTP ports outright) —
      # pulled from a sibling .env file (see .env.example); left unset, email-sending calls fail
      # clearly with an operator-facing error instead of the app refusing to boot.
      SNOWPRO_EMAIL_API_KEY: ${SNOWPRO_EMAIL_API_KEY:-}
      SNOWPRO_EMAIL_FROM: ${SNOWPRO_EMAIL_FROM:-}
      SNOWPRO_EMAIL_FROM_NAME: ${SNOWPRO_EMAIL_FROM_NAME:-}
      # Issue #70: emailed links (password reset, admin-added-user login link) always use the live
      # request's own Host header by default -- deliberately NOT an auto-detected "stable" hostname
      # (issue #68 tried Windows COMPUTERNAME / Mac-Linux HOSTNAME; real phone testing found neither
      # actually reaches a phone reliably, see server.ts's publicOrigin() for the full story) and
      # deliberately NOT a pinned static IP either (rejected -- breaks portability across networks).
      # This is purely optional: only set it if you want to force a specific value.
      SNOWPRO_HOST_NAME: ${SNOWPRO_HOST_NAME:-}
      # Google OAuth login (issue #113) -- an additional sign-in option alongside the password
      # flow above, not a replacement. Left unset, LoginGate.tsx's "Continue with Google" button
      # never appears at all (GET /api/oauth/google/available reports it unavailable) rather than
      # showing a button that would 404 on click. Get these from Google Cloud Console -> APIs &
      # Services -> Credentials -> OAuth 2.0 Client ID (Web application), with an authorized
      # redirect URI of http://localhost:8080/api/oauth/google/callback for local dev.
      SNOWPRO_GOOGLE_CLIENT_ID: ${SNOWPRO_GOOGLE_CLIENT_ID:-}
      SNOWPRO_GOOGLE_CLIENT_SECRET: ${SNOWPRO_GOOGLE_CLIENT_SECRET:-}
      # Issue #159: accounts that should always be admin, comma-separated. Optional -- left unset,
      # the first human account created on a fresh database becomes admin as before. Set it on a
      # PUBLIC deployment: without it, admin goes to whoever signs up first, which after a fresh
      # deploy can be a stranger rather than you. Grant-only, so a typo here can never demote an
      # existing admin and lock you out.
      SNOWPRO_ADMIN_EMAILS: ${SNOWPRO_ADMIN_EMAILS:-}
      # Issue #160: "Explore the demo" -- lets a visitor use the real app without registering, on a
      # throwaway account reaped after SNOWPRO_GUEST_TTL_DAYS of inactivity. DEFAULT OFF: it adds an
      # unauthenticated endpoint that writes to the database, which a self-hosted LAN box gains
      # nothing from. Turn it on for a public deployment where signup friction costs you visitors.
      # Also the fast kill switch -- flipping this off and restarting beats waiting on a release.
      SNOWPRO_ENABLE_GUEST: ${SNOWPRO_ENABLE_GUEST:-}
      SNOWPRO_GUEST_TTL_DAYS: ${SNOWPRO_GUEST_TTL_DAYS:-}
      SNOWPRO_GUEST_MAX_LIVE: ${SNOWPRO_GUEST_MAX_LIVE:-}
      # "log" (default) reports what the reaper WOULD delete without deleting it; "delete" enacts.
      # Ship a new deployment in log mode for one release and read the logs before switching -- this
      # is the only thing in the app that removes user rows on its own.
      SNOWPRO_GUEST_REAP: ${SNOWPRO_GUEST_REAP:-}
      # Legal pages (#182). Unset means no /privacy/, /terms/, /about/, /accessibility/ or
      # /security/ is generated -- correct for a private instance, and the only safe default for a
      # public image, since a policy must name whoever is actually answerable for THIS deployment.
      SNOWPRO_LEGAL_OPERATOR: ${SNOWPRO_LEGAL_OPERATOR:-}
      SNOWPRO_LEGAL_CONTACT: ${SNOWPRO_LEGAL_CONTACT:-}
      SNOWPRO_SITE_ORIGIN: ${SNOWPRO_SITE_ORIGIN:-}
      SNOWPRO_LEGAL_JURISDICTION: ${SNOWPRO_LEGAL_JURISDICTION:-}
      SNOWPRO_LEGAL_OPERATOR_FORM: ${SNOWPRO_LEGAL_OPERATOR_FORM:-}
      SNOWPRO_LEGAL_PRODUCT_NAME: ${SNOWPRO_LEGAL_PRODUCT_NAME:-}
    restart: unless-stopped
