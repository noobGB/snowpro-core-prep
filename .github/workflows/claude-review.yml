name: Claude PR Review

# Automatic review on every PR, scoped to this repo's actual failure modes rather than a generic
# checklist. Structure follows anthropics/claude-code-action's own pr-review-comprehensive.yml
# example (verified current as of this workflow's creation — re-check that example if this ever
# needs updating, since claude-code-action's inputs have changed across versions before).

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    # The action refuses any bot-authored PR by default and exits non-zero rather than skipping
    # cleanly (confirmed: "Workflow initiated by non-human actor... Process completed with exit
    # code 1") -- so without this guard, every Dependabot PR shows a red "review: fail" forever,
    # purely as noise (not a real signal; see CLAUDE.md for why bot PRs are deliberately not
    # reviewed by this workflow). Checking user.type == 'Bot' rather than hardcoding
    # 'dependabot[bot]' so this also covers any other bot that opens PRs here later.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md first and ground this review in its documented architecture — it's the
            source of truth for this repo's conventions, not general best practice.

            Review this PR's diff for:

            1. **Correctness.** This repo has a documented concurrency contract: `data/progress.json`
               has two independent writers — `pipeline/src/server.ts`'s `/api/progress` HTTP routes,
               and `mcp-server/`'s direct file writes (same file, via a Docker bind mount, no HTTP
               involved). Both sides use an ETag/If-Match (file mtime) protocol to detect a stale
               write — see CLAUDE.md's "Progress/persistence" section. Flag anything in this diff
               that could write to that file without going through the existing protocol, or that
               changes the protocol on only one side.

            2. **Architecture consistency.** `pipeline/`, `app/`, and `mcp-server/` are three
               independent npm packages, not an npm workspace — shared types/logic are hand-
               duplicated across them deliberately (see CLAUDE.md). Flag any drift: a type or
               constant changed in one package's copy but not the others' matching copy.

            3. **Test coverage.** Flag non-trivial logic changes in `pipeline/` or `mcp-server/`
               with no corresponding vitest test. `app/` has no test infrastructure today (a known,
               separate gap, not something to flag repeatedly on every PR) — for `app/` changes,
               only flag something that looks unusually risky to ship untested (e.g. a scoring or
               concurrency change), not routine UI work.

            Do not comment on formatting or style issues oxlint would already catch. Post findings
            as a single top-level review comment, ranked most-severe first, each stating a concrete
            failure scenario (inputs/state → wrong behavior), not a vague style note. If nothing
            genuinely warrants a finding, say so plainly rather than inventing one.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
