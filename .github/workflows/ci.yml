name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Issue #101: lets release.yml invoke this whole suite as a reusable workflow against the exact
  # tagged commit, so a tag can't publish a GHCR image without CI actually passing on that SHA.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  pipeline:
    name: pipeline (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  app:
    name: app (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # NOT `tsc --noEmit` -- app/tsconfig.json is solution-style ("files": [], references to
      # tsconfig.app.json/tsconfig.node.json), which only does real work under `tsc -b`. A bare
      # `tsc --noEmit` against it silently typechecks zero files and exits 0 unconditionally --
      # confirmed by injecting an obvious type error and watching it exit 0 anyway. This job (and
      # every manual `tsc --noEmit` run against this package) has never actually caught a type
      # error since this tsconfig was set up. `tsc -b --noEmit` resolves the project references
      # and genuinely typechecks.
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  mcp-server:
    name: mcp-server (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            app/package-lock.json
            mcp-server/package-lock.json
      # mcp-server isn't an npm workspace with pipeline/app (see CLAUDE.md), but it imports their
      # .ts source directly by relative path (session.ts -> app/src/lib/{readiness,scoring}.ts,
      # etc.) rather than reimplementing that logic. tsc resolves those files' OWN imports (react,
      # unified, mdast, ...) through pipeline/'s and app/'s own node_modules, not mcp-server's -- so
      # typecheck needs both siblings' dependencies installed too, even though nothing in mcp-server
      # actually runs their code. Confirmed as a real gap, not a hypothetical: this never surfaced
      # locally because every dev machine already had all three node_modules installed already, but
      # a genuinely clean checkout (as CI always is) does not.
      - name: Install pipeline/ deps (mcp-server's typecheck resolves types through here)
        working-directory: pipeline
        run: npm ci
      - name: Install app/ deps (mcp-server's typecheck resolves types through here)
        working-directory: app
        run: npm ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-smoke:
    name: docker build + boot smoke test
    runs-on: ubuntu-latest
    # Guest mode is off by default (see guestMode.ts on why), so docker-compose.yml would start it
    # disabled and the guest smoke steps below would have nothing to test. Turning it on here is
    # also the point: it means CI exercises the code path the public deployment actually runs.
    env:
      SNOWPRO_ENABLE_GUEST: "1"
    steps:
      - uses: actions/checkout@v7
      # Fresh checkout has no ./data (gitignored). The final image stage runs as non-root `node`
      # (Dockerfile's USER node); a runtime bind mount overlays the image's own chown with the HOST
      # directory's ownership. Left to Docker to auto-create implicitly, ./data comes up root-owned
      # and non-writable by `node`, so server.ts's verifyDataDirWritable() fails its write probe and
      # the container exits 1 -- a CI-only false negative, not a real image bug. Pre-creating it
      # with open perms avoids that.
      - name: Pre-create ./data (see Dockerfile's non-root USER + bind-mount interaction)
        run: mkdir -p data && chmod 777 data
      - name: docker compose build
        run: docker compose build
      - name: docker compose up -d
        run: docker compose up -d
      - name: Wait for readiness (pipeline runs at boot before the port binds)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "Up after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became ready within 60s"
          exit 1
      - name: Smoke-test HTTP 200
        run: curl --fail -sS http://localhost:8080/ -o /dev/null
      # A bare 200 on / only proves the server boots and serves static files -- it says nothing
      # about whether the actual auth surface (this app's core feature) still works. A regression
      # that broke POST /api/session or the OAuth-availability check while still returning 200 on
      # / would previously sail straight through this job. These exercise the real routes with the
      # exact shapes the frontend depends on.
      - name: Smoke-test POST /api/session (new-email path)
        run: |
          body=$(curl --fail -sS -X POST http://localhost:8080/api/session \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke-test@example.invalid"}')
          echo "$body"
          echo "$body" | jq -e '.status == "new"'
      - name: Smoke-test GET /api/oauth/google/available
        run: |
          body=$(curl --fail -sS http://localhost:8080/api/oauth/google/available)
          echo "$body"
          echo "$body" | jq -e 'has("available") and (.available == false)'
      # Guest mode (#160). The admin-route assertion is the reason these live here rather than in a
      # unit test: it proves express middleware ORDERING inside the real container -- that
      # requireAdmin actually sits in front of /api/admin/* for a session minted by the
      # unauthenticated guest endpoint. No unit test can establish that.
      - name: Smoke-test guest mode (create, identify, isolate)
        run: |
          jar=$(mktemp)
          body=$(curl --fail -sS -c "$jar" -X POST http://localhost:8080/api/auth/guest)
          echo "created: $body"
          echo "$body" | jq -e '.isGuest == true'
          echo "$body" | jq -e '.email | endswith("@guest.invalid")'

          me=$(curl --fail -sS -b "$jar" http://localhost:8080/api/me)
          echo "me: $me"
          echo "$me" | jq -e '.isGuest == true'
          echo "$me" | jq -e '.role == "user"'

          curl --fail -sS -b "$jar" http://localhost:8080/api/progress -o /dev/null

          code=$(curl -sS -b "$jar" -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/users)
          echo "admin route as guest: $code"
          test "$code" = "403" || { echo "::error::A guest reached /api/admin/users (got $code, want 403)"; exit 1; }

          # Idempotent for a browser that already holds a guest session -- otherwise every refresh
          # or double-click mints another row.
          again=$(curl --fail -sS -b "$jar" -c "$jar" -X POST http://localhost:8080/api/auth/guest)
          test "$(echo "$again" | jq -r .email)" = "$(echo "$body" | jq -r .email)" \
            || { echo "::error::Second POST /api/auth/guest minted a new account instead of reusing the session"; exit 1; }
      - name: Smoke-test that /api/me advertises guest availability
        run: |
          body=$(curl -sS http://localhost:8080/api/me)
          echo "$body"
          echo "$body" | jq -e '.guestAvailable == true'
      # Self-service erasure (#180). Lives here rather than in a unit test for the same reason the
      # guest block does: there is no server.spec.ts, and what matters is the real route behind real
      # middleware in the real container -- including that a 204 actually clears the session cookie.
      #
      # Deliberately creates its OWN account rather than reusing ci-smoke-test@example.invalid. That
      # one is the first account this container ever saw, so roleForNewAccount() made it admin, and
      # the route correctly refuses to delete the last remaining admin. Reusing it would test the
      # guard, not the happy path -- and would look like a broken endpoint.
      # Self-service erasure (#180). Lives here rather than in a unit test for the same reason the
      # guest block does: there is no server.spec.ts, and what matters is the real route behind real
      # middleware in the real container -- including that a 204 actually clears the session cookie.
      #
      # Two accounts, deliberately. The step above posts only {email}, which returns status "new"
      # WITHOUT creating a row, and guests aren't counted by humanUsersCount() -- so the first
      # account created here is the first human this container has seen and roleForNewAccount()
      # makes it admin. The route correctly refuses to delete the last remaining admin, so a
      # single-account version of this test would assert the guard while looking like a broken
      # endpoint. Account A proves the guard; account B proves the happy path.
      - name: Smoke-test DELETE /api/account (re-auth required, then erases)
        run: |
          jarA=$(mktemp)
          curl --fail -sS -c "$jarA" -X POST http://localhost:8080/api/session             -H 'Content-Type: application/json'             -d '{"email":"ci-admin@example.invalid","password":"correct-horse-battery","name":"CI Admin"}' -o /dev/null
          meA=$(curl --fail -sS -b "$jarA" http://localhost:8080/api/me)
          echo "A: $meA"
          echo "$meA" | jq -e '.role == "admin"'             || { echo "::error::Expected the first human account to be admin; the two-account setup below depends on it"; exit 1; }

          code=$(curl -sS -b "$jarA" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{"password":"correct-horse-battery"}')
          test "$code" = "400" || { echo "::error::The last remaining admin deleted itself (got $code, want 400)"; exit 1; }

          jar=$(mktemp)
          curl --fail -sS -c "$jar" -X POST http://localhost:8080/api/session             -H 'Content-Type: application/json'             -d '{"email":"ci-delete-me@example.invalid","password":"correct-horse-battery","name":"CI Delete"}' -o /dev/null
          me=$(curl --fail -sS -b "$jar" http://localhost:8080/api/me)
          echo "B: $me"
          echo "$me" | jq -e '.role == "user"'

          # A live session must NOT be sufficient on its own.
          code=$(curl -sS -b "$jar" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{}')
          test "$code" = "403" || { echo "::error::DELETE /api/account accepted no password (got $code, want 403)"; exit 1; }

          code=$(curl -sS -b "$jar" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{"password":"wrong-password"}')
          test "$code" = "403" || { echo "::error::DELETE /api/account accepted a wrong password (got $code, want 403)"; exit 1; }

          code=$(curl -sS -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{"password":"correct-horse-battery"}')
          test "$code" = "204" || { echo "::error::DELETE /api/account failed for a valid password (got $code, want 204)"; exit 1; }

          # The cookie must be gone, and the account with it.
          code=$(curl -sS -b "$jar" -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)
          test "$code" = "401" || { echo "::error::Session survived account deletion (got $code, want 401)"; exit 1; }

          # The address is reusable -- proof the row is gone, not merely flagged.
          body=$(curl --fail -sS -X POST http://localhost:8080/api/session             -H 'Content-Type: application/json' -d '{"email":"ci-delete-me@example.invalid"}')
          echo "$body" | jq -e '.status == "new"'             || { echo "::error::Deleted email is not reusable -- the users row survived"; exit 1; }
      - name: Smoke-test DELETE /api/account for a guest (phrase, not password)
        run: |
          jar=$(mktemp)
          curl --fail -sS -c "$jar" -X POST http://localhost:8080/api/auth/guest -o /dev/null

          # A guest's password hash is the deliberately unusable sentinel from createGuestUser(), so
          # verifyPassword() can never succeed -- demanding a password would make guests undeletable.
          code=$(curl -sS -b "$jar" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{"confirm":"nope"}')
          test "$code" = "400" || { echo "::error::Guest deletion accepted a wrong phrase (got $code, want 400)"; exit 1; }

          code=$(curl -sS -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/account             -H 'Content-Type: application/json' -d '{"confirm":"delete my account"}')
          test "$code" = "204" || { echo "::error::Guest could not delete their own account (got $code, want 204)"; exit 1; }
      # Generated crawlable pages. writeOutput() wraps rendering in a try/catch so a failure can
      # never take the container down on boot -- which means a broken generator would otherwise fail
      # SILENTLY, with the site up and /guide/ quietly 404ing. These steps are what turns that into
      # a red build instead of a discovery weeks later.
      - name: Smoke-test the generated /guide/ pages
        run: |
          ct=$(curl -sS -o /tmp/guide.html -w '%{content_type}' http://localhost:8080/guide/)
          echo "content-type: $ct"
          case "$ct" in text/html*) ;; *) echo "::error::/guide/ served $ct, want text/html"; exit 1;; esac
          grep -q "SnowPro Core (COF-C03) exam guide" /tmp/guide.html \
            || { echo "::error::/guide/ did not contain its own heading — generator likely skipped"; exit 1; }
          # Proves it is a REAL file rather than the SPA shell: the shell has an empty #root and
          # none of this content.
          grep -q 'id="root"' /tmp/guide.html \
            && { echo "::error::/guide/ returned the SPA shell, not the generated page"; exit 1; }
          grep -q "<table" /tmp/guide.html || { echo "::error::/guide/ is missing the domain-weight table"; exit 1; }

          # One domain page, to prove the per-domain set generated too.
          curl --fail -sS http://localhost:8080/guide/5-data-collaboration/ -o /tmp/d5.html
          grep -q "Data Collaboration" /tmp/d5.html || { echo "::error::domain page missing its title"; exit 1; }
      - name: Smoke-test sitemap.xml and llms.txt are real files, not the SPA shell
        run: |
          # These previously 200'd with text/html because the SPA catch-all answered them -- a false
          # positive that a status-code-only check would still pass. Assert the content type.
          for path in sitemap.xml llms.txt robots.txt; do
            ct=$(curl -sS -o /tmp/f -w '%{content_type}' "http://localhost:8080/$path")
            echo "$path -> $ct"
            case "$ct" in
              text/html*) echo "::error::/$path fell through to the SPA shell"; exit 1;;
            esac
          done
          curl -sS http://localhost:8080/sitemap.xml | grep -q "<urlset" || { echo "::error::sitemap.xml is not a sitemap"; exit 1; }
          curl -sS http://localhost:8080/llms.txt | grep -q "SnowPro Core Prep" || { echo "::error::llms.txt is empty or wrong"; exit 1; }
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down (always, so the runner doesn't leak containers/networks)
        if: always()
        run: docker compose down -v
