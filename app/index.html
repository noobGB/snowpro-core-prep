    <!-- Issue #154. This file is served for EVERY SPA route via server.ts's catch-all, so a
         hardcoded canonical means every route self-canonicalizes to the home page. That's correct

         should be indexed as a separate URL in the first place. The corollary is that the
         pipeline-generated /guide/ pages must never be served through this file -- they're real

    <!-- og:image/twitter:image need an absolute URL per spec, and this file is static (no
         server-side templating, see the theme-sync script's own comment above on why) -- hardcoded

    <!-- Issue #158: 1200x630 is exactly the 1.91:1 ratio LinkedIn, Slack and X cut
         summary_large_image cards at, so the platform never crops or scales this. It replaces
         landing-dashboard.png, which at 1280x860 (1.49:1) was centre-cropped into a composition
         nobody chose. Declaring the dimensions also lets those platforms lay out the card without
         fetching the file first.
         Generated from tools/og/og-card.html -- regenerate with `cd tools/og && npm run og`
         rather than editing the PNG, so the card can't drift from the product's own wording. -->

         summary_large_image card renders fine without them. -->

    <meta name="twitter:title" content="SnowPro Core Prep" />

    <meta name="twitter:image:alt" content="SnowPro Core Prep — pass the SnowPro Core exam. Free, no signup. Timed mock exams, weighted readiness, and an adaptive study plan." />
    <script>
      // Pre-paint theme sync — avoids a flash of dark UI before React mounts and App.tsx's effect
      // runs. Only "light" needs handling here: "dark"/"system"/missing/invalid data all already
      // render correctly from tokens.css's defaults with zero JS. This only fully covers the
      // localStorage-backed case (vite dev, or the built files opened directly) — the HTTP-backed
      // deployment (SNOWPRO_DATA_DIR/api/progress, see progress.ts) still gets a brief flash since
      // persist() never writes localStorage in that mode. Known, accepted tradeoff: closing it
      // fully needs server-side HTML templating, which pipeline/src/server.ts doesn't have today —
      // disproportionate cost for a personal-scale app.
      try {
        var raw = localStorage.getItem("snowprep.progress");
        var parsed = raw ? JSON.parse(raw) : null;
        if (parsed && parsed.settings && parsed.settings.theme === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Non-JSON/garbage localStorage — fall through to the CSS default (dark).
      }
    </script>
    <title>SnowPro Core Prep</title>
    <!-- Issue #155: structured data, so search and answer engines have a machine-readable statement
         of what this is, that it's free, and who wrote it.

         GOVERNING RULE: this file is hand-written, so nothing here carries a number that changes
         when the content bank does — no question counts, no domain weights, no durations. Those
         belong in the pipeline-generated /guide/ pages, where they're derived from content.json and
         cannot go stale. DOCS_MAP.md's opening paragraphs exist because this repo has already been
         bitten by exactly that drift.

         The existing CSP already allows inline <script> (script-src 'self' 'unsafe-inline', see
         server.ts), so this needs no CSP change. Verified in the browser console, not assumed.

         Deliberately NOT included, so nobody adds them later:
          - aggregateRating/Review: there are no reviews. Inventing them is schema spam and a real
            manual-action risk, and it would be a lie about a study tool people trust with an exam.
          - Organization: there isn't one. Person is both the truth and the stronger authorship claim.
          - Quiz/Question: would mean publishing question text as schema — commoditizes the bank for
            zero citation benefit.
          - SearchAction/sitelinks searchbox: there is no public search endpoint, so declaring one
            claims a capability that doesn't exist.
          - BreadcrumbList: no hierarchy on this page. It belongs on the /guide/ pages, which have one. -->

  <body>
    <!-- Issue #154. This app is entirely client-rendered, so without this block the document a
         crawler receives is a ~3.7 KB shell: a title, a meta description, and an empty #root. The
         hero, the pitch, all eight feature cards -- invisible. Google executes JS and sees the real
         page, so this barely moves Google; the audience here is the AI/answer-engine crawlers that
         mostly don't, and for them it's the difference between an empty shell and a real
         description of what lives at this URL.
         Scope, stated honestly so this doesn't get mistaken for the whole SEO story: a <noscript>
         block *describing* an app is thin content. The pipeline-generated /guide/ pages are the
         ones that answer a real question ("what are the COF-C03 domain weights") and are what
         actually earns a citation. This is the cheap, zero-risk baseline, not a substitute.
         A human with JS disabled also sees this, so it's written to read as a real page.
         The copy below is duplicated verbatim from HomePage.tsx (kicker, h1, pitch, FEATURES) --
         deliberately character-identical rather than reworded, so the two can be diffed by grep.
         Note FEATURES intentionally omits the MCP server: see HomePage.tsx's own comment on why
         advertising it on the public deployment would be a false claim about what signing in here
         gets you. Don't "helpfully" add it back in this copy either. -->
    <noscript>
      <div style="max-width: 780px; margin: 0 auto; padding: 48px 24px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6;">
        <p style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7;">COF-C03 · SNOWPRO CORE PREP</p>
        <h1>Everything you need to pass the SnowPro Core exam.</h1>
        <p>
          Timed mock exams, a readiness score weighted by the real exam&rsquo;s domain weights, and
          a study plan that adapts to your exam date &mdash; sign in to start tracking your
          progress.
        </p>
        <p><strong>This app needs JavaScript enabled to run.</strong></p>
        <h2>What&rsquo;s inside</h2>
        <dl>
          <dt><strong>Timed mock exams</strong></dt>
          <dd>Full-length, matching the real exam's question count and domain split -- flag questions, jump between them, and review your wrong answers first.</dd>
          <dt><strong>Weighted readiness</strong></dt>
          <dd>A dashboard scored against the real exam's actual domain weights, not a flat percentage -- so you always know exactly where to focus next.</dd>
          <dt><strong>Practice, domain by domain</strong></dt>
          <dd>Untimed drills, one domain at a time. Every wrong answer joins a missed-question notebook you can retry as its own focused set.</dd>
          <dt><strong>Flashcards that adapt</strong></dt>
          <dd>A quick knew-it/missed-it rating after every card biases which ones resurface first next session, so weak spots get more repetition automatically.</dd>
          <dt><strong>Adaptive study plan</strong></dt>
          <dd>A day-by-day plan that remaps itself to your actual exam date, not a fixed calendar -- compresses automatically into a prioritized checklist if your exam is close.</dd>
          <dt><strong>Pacing analytics</strong></dt>
          <dd>A per-question timing chart flags your slowest questions and links straight back to review them, benchmarked against the real exam's own time budget.</dd>
          <dt><strong>Backup and reset, on your terms</strong></dt>
          <dd>Export your entire progress as one file, restore it on another device, or wipe the slate clean for a fresh start -- always your call, never automatic.</dd>
          <dt><strong>Your data stays private</strong></dt>
          <dd>Your study activity isn't sold, tracked, or shared with anyone. It's yours, and it stays that way.</dd>
        </dl>
        <p>
          SnowPro Core Prep is a free study app for the Snowflake SnowPro Core (COF-C03)
          certification. There&rsquo;s no signup to try it &mdash; the demo drops you straight into
          the real app, and you can turn that into a permanent account later without losing your
          progress.
        </p>
        <p style="opacity: 0.7; font-size: 13px;">
          An independent, unofficial project &mdash; not affiliated with, endorsed by, or sponsored
          by Snowflake Inc.
        </p>
      </div>
