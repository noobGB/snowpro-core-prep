<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Issue #121: a shared link (LinkedIn/Slack/README) previously unfurled with no preview text
         at all -- only <title> existed. Values mirror LandingPage.tsx's own pitch copy so the
         unfurl and the landing page tell the same story. -->
    <meta name="description" content="Everything you need to pass the Snowflake SnowPro Core (COF-C03) exam — timed mock exams, a readiness score weighted by the real exam's domain weights, flashcards, and a day-by-day study plan." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SnowPro Core Prep" />
    <meta property="og:description" content="Everything you need to pass the Snowflake SnowPro Core (COF-C03) exam — timed mock exams, a readiness score weighted by the real exam's domain weights, flashcards, and a day-by-day study plan." />
    <!-- og:image/twitter:image need an absolute URL per spec, and this file is static (no
         server-side templating, see the theme-sync script's own comment above on why) -- hardcoded
         to the public deployment's own domain, since that's the only host a shared link actually
         points at; a LAN/localhost visitor never triggers a link-unfurl in the first place. -->
    <meta property="og:image" content="https://snowpro.gauravbarwalia.com/landing-dashboard.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SnowPro Core Prep" />
    <meta name="twitter:description" content="Everything you need to pass the Snowflake SnowPro Core (COF-C03) exam — timed mock exams, a readiness score weighted by the real exam's domain weights, flashcards, and a day-by-day study plan." />
    <meta name="twitter:image" content="https://snowpro.gauravbarwalia.com/landing-dashboard.png" />
    <script>
      // Pre-paint theme sync — avoids a flash of dark UI before React mounts and App.tsx's effect
      // runs. Only "light" needs handling here: "dark"/"system"/missing/invalid data all already
      // render correctly from tokens.css's defaults with zero JS. This only fully covers the
      // localStorage-backed case (vite dev, or the built files opened directly) — the HTTP-backed
      // deployment (SNOWPRO_DATA_DIR/api/progress, see progress.ts) still gets a brief flash since
      // persist() never writes localStorage in that mode. Known, accepted tradeoff: closing it
      // fully needs server-side HTML templating, which pipeline/src/server.ts doesn't have today —
      // disproportionate cost for a personal-scale app.
      try {
        var raw = localStorage.getItem("snowprep.progress");
        var parsed = raw ? JSON.parse(raw) : null;
        if (parsed && parsed.settings && parsed.settings.theme === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Non-JSON/garbage localStorage — fall through to the CSS default (dark).
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>SnowPro Core Prep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
